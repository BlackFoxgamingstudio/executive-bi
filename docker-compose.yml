version: "3.9"
# Sovereign Executive BI — docker-compose
# Usage: docker-compose up --build

services:
  executive-bi:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sovereign-executive-bi:latest
    container_name: sovereign-executive-bi
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      SBB_DATA_SOURCE_URL: ${SBB_DATA_SOURCE_URL}
      SBB_KPI_DEFINITIONS_PATH: ${SBB_KPI_DEFINITIONS_PATH}
      SBB_ANOMALY_SENSITIVITY: ${SBB_ANOMALY_SENSITIVITY}
      SBB_REPORT_SCHEDULE: ${SBB_REPORT_SCHEDULE}
      SBB_API_KEY: ${SBB_API_KEY:-change-me}
      SBB_N8N_EVENT_BUS_URL: ${SBB_N8N_EVENT_BUS_URL:-http://host.docker.internal:5678/webhook/event-bus}
      SERVICE_PORT: 8790
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./.data:/app/.data:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8790/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sbb-platform

networks:
  sbb-platform:
    external: true
    name: sbb-platform-network
